[project]
name = "local-project-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "pymupdf>=1.26,<2"]
description = "Use local Windows project files from ChatGPT through Secure MCP Tunnel"

[project.scripts]
local-project-mcp = "local_project_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_project_mcp"]
